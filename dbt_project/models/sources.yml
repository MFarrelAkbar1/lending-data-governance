  - name: installments_payments
    description: Repayment history of previous Home Credit credits. Intended grain is one row per SK_ID_PREV + NUM_INSTALMENT_NUMBER
      + NUM_INSTALMENT_VERSION, but split payments create several rows per installment (see issue log DQ-007).
    meta:
      data_owner: Collections
      data_steward: Data Governance
      upstream_system: Home Credit (Kaggle extract)
      grain: SK_ID_PREV + NUM_INSTALMENT_NUMBER + NUM_INSTALMENT_VERSION (+ payment)
      refresh_frequency: on reload (simulated daily)
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        name: raw_installments_payments__key_unique
        description: One row per installment; fails because of split payments (DQ-007).
        arguments:
          combination_of_columns:
          - '"SK_ID_PREV"'
          - '"NUM_INSTALMENT_NUMBER"'
          - '"NUM_INSTALMENT_VERSION"'
        config:
          severity: warn
          meta:
            dq_dimension: uniqueness
            rule_id: INST_KEY_UNIQUE
    - dbt_utils.expression_is_true:
        name: raw_installments_payments__payment_not_hugely_above_instalment
        description: Payment is at most 2x the installment amount (DQ-014).
        arguments:
          expression: not ("AMT_INSTALMENT" > 0 and "AMT_PAYMENT" > 2 * "AMT_INSTALMENT")
        config:
          severity: warn
          meta:
            dq_dimension: consistency
            rule_id: INST_PAYMENT_LE_2X_INSTALMENT
    - dbt_utils.recency:
        name: raw_installments_payments__recency
        description: Latest _loaded_at is within the last day.
        arguments:
          datepart: day
          field: _loaded_at
          interval: 1
        config:
          severity: warn
          meta:
            dq_dimension: timeliness
            rule_id: INSTALLMENTS_PAYMENTS_FRESH
    columns:
    - name: SK_ID_PREV
      description: 'ID of previous credit in Home credit related to loan in our sample. (One loan in our sample can have 0,1,2
        or more previous loans in Home Credit) [source note: hashed]'
      quote: true
      meta:
        classification: Confidential
        pii: true
        pdp_category: general (pseudonymous identifier)
        data_owner: Collections
        data_steward: Data Governance
      data_tests:
      - relationships:
          name: raw_installments_payments__previous_exists
          description: Every installment belongs to a previous application (DQ-009).
          arguments:
            to: source('raw', 'previous_application')
            field: '"SK_ID_PREV"'
          config:
            severity: warn
            meta:
              dq_dimension: referential_integrity
              rule_id: INST_PREVIOUS_EXISTS
    - name: SK_ID_CURR
      description: 'ID of loan in our sample [source note: hashed]'
      quote: true
      meta:
        classification: Confidential
        pii: true
        pdp_category: general (pseudonymous identifier)
        data_owner: Collections
        data_steward: Data Governance
      data_tests:
      - relationships:
          name: raw_installments_payments__applicant_exists
          description: Every installment belongs to an application in application_train.
          arguments:
            to: source('raw', 'application_train')
            field: '"SK_ID_CURR"'
          config:
            severity: error
            meta:
              dq_dimension: referential_integrity
              rule_id: INST_APPLICANT_EXISTS
    - name: NUM_INSTALMENT_VERSION
      description: Version of installment calendar (0 is for credit card) of previous credit. Change of installment version
        from month to month signifies that some parameter of payment calendar has changed
      quote: true
      meta:
        classification: Restricted
        pii: true
        pdp_category: specific (personal financial data)
        data_owner: Collections
        data_steward: Data Governance
    - name: NUM_INSTALMENT_NUMBER
      description: On which installment we observe payment
      quote: true
      meta:
        classification: Restricted
        pii: true
        pdp_category: specific (personal financial data)
        data_owner: Collections
        data_steward: Data Governance
    - name: DAYS_INSTALMENT
      description: 'When the installment of previous credit was supposed to be paid (relative to application date of current
        loan) [source note: time only relative to the application]'
      quote: true
      meta:
        classification: Restricted
        pii: true
        pdp_category: specific (personal financial data)
        data_owner: Collections
        data_steward: Data Governance
      data_tests:
      - dbt_expectations.expect_column_values_to_be_between:
          name: raw_installments_payments__due_date_sign
          description: Due date is before the current application (<= 0).
          arguments:
            max_value: 0
          config:
            severity: error
            meta:
              dq_dimension: consistency
              rule_id: INST_DUE_DATE_SIGN
    - name: DAYS_ENTRY_PAYMENT
      description: 'When was the installments of previous credit paid actually (relative to application date of current loan)
        [source note: time only relative to the application]'
      quote: true
      meta:
        classification: Restricted
        pii: true
        pdp_category: specific (personal financial data)
        data_owner: Collections
        data_steward: Data Governance
      data_tests:
      - not_null:
          name: raw_installments_payments__entry_date_not_null
          description: Payment date is present; missing rows are unpaid installments (DQ-013).
          config:
            severity: warn
            meta:
              dq_dimension: completeness
              rule_id: INST_ENTRY_DATE_NOT_NULL
      - dbt_expectations.expect_column_values_to_be_between:
          name: raw_installments_payments__entry_date_sign
          description: Payment happened before the current application (<= 0).
          arguments:
            max_value: 0
          config:
            severity: error
            meta:
              dq_dimension: consistency
              rule_id: INST_ENTRY_DATE_SIGN
    - name: AMT_INSTALMENT
      description: What was the prescribed installment amount of previous credit on this installment
      quote: true
      meta:
        classification: Restricted
        pii: true
        pdp_category: specific (personal financial data)
        data_owner: Collections
        data_steward: Data Governance
      data_tests:
      - dbt_expectations.expect_column_values_to_be_between:
          name: raw_installments_payments__instalment_non_negative
          description: Installment amount is not negative.
          arguments:
            min_value: 0
          config:
            severity: error
            meta:
              dq_dimension: validity
              rule_id: INST_INSTALMENT_NON_NEGATIVE
    - name: AMT_PAYMENT
      description: What the client actually paid on previous credit on this installment
      quote: true
      meta:
        classification: Restricted
        pii: true
        pdp_category: specific (personal financial data)
        data_owner: Collections
        data_steward: Data Governance
      data_tests:
      - not_null:
          name: raw_installments_payments__payment_not_null
          description: Payment amount is present; missing rows are unpaid installments (DQ-013).
          config:
            severity: warn
            meta:
              dq_dimension: completeness
              rule_id: INST_PAYMENT_NOT_NULL
      - dbt_expectations.expect_column_values_to_be_between:
          name: raw_installments_payments__payment_non_negative
          description: Payment amount is not negative.
          arguments:
            min_value: 0
          config:
            severity: error
            meta:
              dq_dimension: validity
              rule_id: INST_PAYMENT_NON_NEGATIVE
    - name: _loaded_at
      description: Timestamp (UTC) when the row was loaded into schema raw by ingestion/sample_and_load.py.
      quote: true
      meta:
        classification: Internal
        pii: false
        pdp_category: none
        data_owner: Data Platform
        data_steward: Data Governance
    - name: _source_file
      description: Source CSV file the row was read from.
      quote: true
      meta:
        classification: Internal
        pii: false
        pdp_category: none
        data_owner: Data Platform
        data_steward: Data Governance
    - name: _batch_id
      description: Identifier of the load batch; joins to audit.load_log.batch_id.
      quote: true
      meta:
        classification: Internal
        pii: false
        pdp_category: none
        data_owner: Data Platform
        data_steward: Data Governance
- name: dq
  description: Data quality monitoring tables written by reports/collect_dq_results.py.
  schema: dq
  tables:
  - name: dq_results_history
    description: One row per dbt test per run, appended after every `dbt test`.
    meta:
      data_owner: Data Governance
      data_steward: Data Governance
      upstream_system: dbt run_results.json
- name: audit
  description: Load audit tables written by ingestion/sample_and_load.py.
  schema: audit
  tables:
  - name: load_log
    description: 'One row per raw table per load run: row count, column count, duration, status.'
    meta:
      data_owner: Data Platform
      data_steward: Data Governance
      upstream_system: ingestion/sample_and_load.py
